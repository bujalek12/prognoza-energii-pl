# Codzienna aktualizacja: dane PSE i pogoda -> hurtownia dbt -> prognoza modelu na jutro.
# Baza DuckDB, modele i rejestr MLflow (tylko z treningow na GitHubie) leza miedzy uruchomieniami
# jako zalaczniki wydania "dane" w tym repo
# (35 MB to za duzo, zeby commitowac baze codziennie do historii gita).
name: codziennie

on:
  schedule:
    # Rano: prognoza na jutro (GitHub potrafi opoznic start o kilka godzin, nadal przed polnoca)
    - cron: "7 8 * * *"
    # Wieczorem: zapis planu PSE na jutro, publikowanego ok. 17:30-19:00 UTC, zanim PSE go poprawi.
    # Trzy terminy, bo GitHub opoznia uruchomienia; minuty "nieokragle", bo pelne godziny sa najbardziej oblozone.
    - cron: "17 18 * * *"
    - cron: "47 19 * * *"
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      trening:
        description: "Wymus ponowny trening modeli"
        type: boolean
        default: false

concurrency:
  group: codziennie          # nigdy dwa uruchomienia naraz: oba pisalyby do tej samej bazy
  cancel-in-progress: false

permissions:
  contents: write            # potrzebne do aktualizacji zalacznikow wydania
  issues: write              # monitoring zaklada zgloszenie, gdy prognozy sie psuja

jobs:
  aktualizacja:
    runs-on: ubuntu-latest
    timeout-minutes: 120      # pierwsze uruchomienie bez bazy: pelna historia + trening
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: Pobranie bazy i modeli z poprzedniego dnia
        run: |
          mkdir -p data/model
          gh release download dane --dir data --pattern 'energia.duckdb' --pattern 'mlflow.db' || echo "pierwsze uruchomienie: brak bazy"
          gh release download dane --dir data/model --pattern '*.txt' --pattern '*.json' --pattern '*.parquet' || echo "brak modeli"

      - name: Pipeline (pobranie + dbt build + prognoza na jutro)
        run: uv run python -m energia.pipeline

      - name: Trening modeli (w poniedzialki, na zadanie albo gdy brak modeli)
        if: ${{ always() }}
        run: |
          # trening tylko w porannym uruchomieniu w poniedzialek (nie przy kazdym wieczornym)
          rano=$([ "${{ github.event.schedule }}" = "7 8 * * *" ] && echo tak || echo nie)
          if { [ "$(date -u +%u)" = "1" ] && [ "$rano" = "tak" ]; } || [ "${{ inputs.trening }}" = "true" ] || [ ! -f data/model/pv_p50.txt ]; then
            uv run python -m energia.model.trening
            uv run python -m energia.model.prognoza
          else
            echo "trening pominiety (nie poniedzialek)"
          fi

      - name: Monitoring prognoz (alarm -> zgloszenie na GitHubie)
        if: ${{ always() }}
        run: |
          uv run python -m energia.model.monitoring >> "$GITHUB_STEP_SUMMARY"
          if [ -s data/alarmy.md ]; then
            numer=$(gh issue list --label monitoring --state open --json number --jq '.[0].number')
            if [ -n "$numer" ]; then
              gh issue comment "$numer" --body-file data/alarmy.md
            else
              gh label create monitoring --color D93F0B --description "Alarmy jakosci prognoz" --force
              gh issue create --title "Monitoring: prognozy odbiegaja od backtestu" --label monitoring --body-file data/alarmy.md
            fi
          fi

      - name: Zapis bazy i modeli do wydania "dane"
        if: ${{ always() }}
        run: |
          gh release view dane >/dev/null 2>&1 || gh release create dane --title "Dane i modele" --notes "Aktualizowane automatycznie przez workflow codziennie."
          gh release upload dane data/energia.duckdb --clobber
          [ -f data/mlflow.db ] && gh release upload dane data/mlflow.db --clobber || true
          [ -f data/dbt_wyniki_testow.json ] && gh release upload dane data/dbt_wyniki_testow.json --clobber || true
          gh release upload dane data/model/* --clobber || true

      - name: Podsumowanie
        if: ${{ always() }}
        run: |
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import duckdb
          con = duckdb.connect("data/energia.duckdb", read_only=True)
          print("### Stan danych\n")
          print("| zrodlo | od | do | wierszy | kiedy |\n|---|---|---|---|---|")
          for r in con.sql("select zrodlo, od, do_, wierszy, kiedy_utc from uruchomienia order by kiedy_utc desc limit 4").fetchall():
              print("| " + " | ".join(str(x) for x in r) + " |")
          n = con.sql("select count(*) from prognozy_modelu").fetchone()[0]
          print(f"\nPrognoz modelu w archiwum: {n}")
          PY
